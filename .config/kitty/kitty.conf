# ─── Font ────────────────────────────────────────────────────────────────────
# Hack Nerd Font Mono, not Mononoki: Mononoki was requested here for years but
# was never installed and is not in the Brewfile, so kitty silently fell back to
# a default face. Hack ships in the Brewfile and is already on disk.
font_family      Hack Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# ─── Keys ────────────────────────────────────────────────────────────────────
# Without this, macOS treats Option as a compose key and Option+Enter,
# Option+P and Alt word-motions never reach the application. Anthropic
# documents this as a requirement for those bindings in Claude Code.
macos_option_as_alt yes

# Cmd+1..9 jump to kitty tab 1..9, counted left to right.
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# ─── Window ──────────────────────────────────────────────────────────────────
background_opacity 0.95

# ─── Theme ───────────────────────────────────────────────────────────────────
# One palette across kitty, tmux, nvim, fzf, delta and bat.
include themes/mocha.conf
