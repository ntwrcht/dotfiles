# Tracked SSH defaults, included from line 1 of the local ~/.ssh/config:
#
#   Include ~/.ssh/dotfiles.conf
#
# ~/.ssh/config itself stays untracked: it holds private host entries, and
# gcloud writes into it. ssh keeps the first value it finds for an option, so
# this file sets only options no host entry sets.

# Hosts added with `sshm add` (local, never committed). Included before
# Host * so each host's own settings win; a missing file is ignored.
Include ~/.ssh/hosts

Host *
  UseKeychain yes
  AddKeysToAgent yes
  ServerAliveInterval 60
