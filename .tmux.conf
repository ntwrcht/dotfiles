# ─────────────────────────────────────────────────────────────────────────────
# tmux configuration
#
# Replaces a vendored copy of oh-my-tmux (gpakosz/.tmux) that was frozen at
# 2023-04-05 and ~3.5 years stale. Upstream's README says to symlink its
# .tmux.conf and never edit it; this repo had copied and edited it, which put
# it off the supported upgrade path. Of the 74 KB it provided, roughly 10% was
# in use — that 10% is reproduced below, readable and owned.
#
# Theme: Catppuccin Mocha.
# Options are documented in tmux(1); written against tmux 3.6a.
# ─────────────────────────────────────────────────────────────────────────────

# ─── Terminal ────────────────────────────────────────────────────────────────
# tmux-256color advertises italics (sitm) and modified-function-key
# capabilities that screen-256color lacks.
set  -g default-terminal "tmux-256color"

# NOTE: do not add a terminal-features RGB override. kitty already advertises
# truecolor and tmux 3.2+ autodetects it. Confirm with:
#   tmux display -p '#{client_termfeatures}'    ->  should contain RGB
set  -s escape-time 10          # no <Esc> lag in vim
set  -s focus-events on         # forwards FocusGained/FocusLost into nvim

# ─── Terminal-based agents (Claude Code) ─────────────────────────────────────
# Documented by Anthropic for running Claude Code under tmux.
#
# allow-passthrough lets a program emit escape sequences straight through to
# the outer terminal. Without it tmux swallows Claude Code's desktop
# notifications and progress bar, both of which kitty supports natively.
set  -g allow-passthrough on

# extended-keys forwards modified keys the legacy encoding cannot express --
# Shift+Enter above all, which otherwise submits instead of inserting a
# newline.
set  -s extended-keys on

# extended-keys-format: the encoding tmux uses for those modified keys.
# NOT in Anthropic's documented snippet, but required here. With the default
# `xterm` format tmux reports Shift+Enter as ^[[27;2;13~ (the xterm
# formatOtherKeys encoding); Claude Code parses kitty's native CSI-u form,
# ^[[13;2u. So the three documented lines alone leave Shift+Enter still
# submitting -- tmux was sending a distinguishable key in a format the app
# does not read. `tmux list-panes -F '#{pane_key_mode}'` reporting "Ext 2"
# is how to tell negotiation succeeded and the problem is downstream.
set  -g extended-keys-format csi-u

# tmux 3.6a's auto-detect table (tty-features.c) grants extkeys to mintty,
# tmux, rxvt, iTerm2, foot and XTerm -- but NOT kitty. Required here, not
# boilerplate.
set  -as terminal-features 'xterm*:extkeys'

# ─── Prefix ──────────────────────────────────────────────────────────────────
# C-b stays primary; C-a is a secondary prefix, as oh-my-tmux provided.
set  -g prefix2 C-a
bind C-a send-prefix -2

# ─── Indexing & history ──────────────────────────────────────────────────────
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g history-limit 50000

# ─── Mouse ───────────────────────────────────────────────────────────────────
set  -g mouse on

# ─── Copy mode (vi) ──────────────────────────────────────────────────────────
setw -g mode-keys vi
set  -g status-keys vi
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# ─── Splits inherit the current directory ────────────────────────────────────
# Matches the old tmux_conf_new_pane_retain_current_path=true.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ─── Pane layouts (bin/tgrid) ────────────────────────────────────────────────
# <prefix>G tiles the window into an even grid; <prefix>M makes the current
# pane the large one on the left. Ratios (tgrid 1:3) are shell-only. M replaces
# the default "clear marked pane"; <prefix>m still toggles the mark.
bind G run-shell "TMUX_PANE=#{pane_id} $HOME/.dotfiles/bin/tgrid"
bind M run-shell "TMUX_PANE=#{pane_id} $HOME/.dotfiles/bin/tgrid main"

# ─── vim-tmux-navigator ──────────────────────────────────────────────────────
# Forwards C-h/j/k/l to nvim when the pane is running vim/nvim/fzf, otherwise
# moves the tmux pane. Pattern is verbatim from christoomey/vim-tmux-navigator.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
# Restore the two keys the bindings above shadow, behind the prefix:
bind C-l  send-keys 'C-l'     # readline clear-screen
bind C-\\ send-keys 'C-\'     # SIGQUIT to the foreground process

# ─── Status line (Catppuccin Mocha) ──────────────────────────────────────────
set  -g status-position top
set  -g status-interval 10
set  -g status-style             "fg=#6c7086,bg=#1e1e2e"
set  -g status-left              " 🐶 | ♦️ #S "
set  -g status-left-style        "fg=#1e1e2e,bg=#a6e3a1,bold"
set  -g status-left-length       40
set  -g status-right             ""
# A dim rule between window entries. With several `ai:` windows open the
# names run together, and the status bar is click-to-switch (mouse is on
# above), so the gap is a click target, not just decoration. surface1 on
# base reads as a divider without competing with the window names.
setw -g window-status-separator      "#[fg=#45475a]│"
setw -g window-status-format         " #I #W "
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style  "fg=#cdd6f4,bg=#45475a,bold"
set  -g pane-border-style        "fg=#45475a"
set  -g pane-active-border-style "fg=#cba6f7"
set  -g message-style            "fg=#cba6f7,bg=#313244,bold"

# ─── Claude Code popup ───────────────────────────────────────────────────────
# <prefix>a drops a Claude Code session over the current pane, opened in that
# pane's directory.
#
# PATH is the whole difficulty here. display-popup runs the command through
# /bin/sh, which inherits the tmux SERVER's environment -- not a login shell's
# -- and that does not include ~/.local/bin where claude lives. `zsh -lc` does
# NOT fix it: a login-but-non-interactive zsh sources .zprofile and skips
# .zshrc, and this repo builds PATH in zsh/path.zsh, which .zshrc sources.
# `zsh -ic` would work but pays ~0.7s of p10k and plugin startup per popup.
# Sourcing the PATH module directly is both correct and immediate.
bind a display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "zsh -c 'source $HOME/.dotfiles/zsh/path.zsh 2>/dev/null; exec claude'"

# <prefix>A opens Claude Code in its own WINDOW instead. The popup above holds
# exactly one session -- `display-popup` modifies the existing popup rather than
# stacking a second one -- and panes stop redrawing while it is up. A window has
# neither limit: several can run at once, `prefix w` switches between them, and
# leaving one does not kill it. Use the popup for a quick question, a window for
# work that outlives your attention.
#
# The window name is format-expanded, so it carries the project directory:
# a window opened in ~/.dotfiles shows up as `ai:.dotfiles`.
bind A new-window -n "ai:#{b:pane_current_path}" -c "#{pane_current_path}" "zsh -c 'source $HOME/.dotfiles/zsh/path.zsh 2>/dev/null; exec claude'"

# ─── Reload ──────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "~/.tmux.conf sourced"

# ─── Machine-local overrides (optional, not tracked) ─────────────────────────
# -q: silently skip when the file does not exist.
source-file -q ~/.tmux.conf.local
