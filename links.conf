# Managed symlinks — the single source of truth.
#
# Read by ./install, ./uninstall, and ./doctor via lib/links.sh.
# Adding a managed config is a one-line change here; no script edits.
#
# Format:  <source>  <target>
#   source — path relative to this repo's root
#   target — path relative to $HOME
# Blank lines and lines starting with # are ignored.

.vimrc              .vimrc
.zshrc              .zshrc
.config/nvim        .config/nvim
.config/kitty       .config/kitty
.config/git         .config/git
.gitconfig          .gitconfig
.tmux.conf          .tmux.conf
.tmux.conf.local    .tmux.conf.local
.editorconfig       .editorconfig
